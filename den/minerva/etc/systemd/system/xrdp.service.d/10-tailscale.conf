# xrdp binds only to the Tailscale IPs (see /etc/xrdp/xrdp.ini), which must
# exist before xrdp starts or it exits. Order after tailscaled and wait for
# both addresses on tailscale0. Ordering only: this does not start or change
# tailscaled.
[Unit]
After=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 120 ]; do ip -4 addr show dev tailscale0 2>/dev/null | grep -q "inet 100.66.141.66/" && ip -6 addr show dev tailscale0 2>/dev/null | grep -q "fd7a:115c:a1e0::5301:8dc8/" && exit 0; i=$$((i+1)); sleep 1; done; echo "tailscale0 addresses not up" >&2; exit 1'
Restart=on-failure
RestartSec=15
