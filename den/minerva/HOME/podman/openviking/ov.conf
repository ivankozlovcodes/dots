{
  "service_name": "openviking-server",
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "api_key",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}"
  },
  "storage": {
    "workspace": "./data",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local"
    }
  },
  "embedding": {
    "max_input_tokens": 200,
    "dense": {
      "provider": "openai",
      "api_base": "http://127.0.0.1:8080/v1",
      "api_key": "local",
      "model": "bge-small-en-v1.5-f16",
      "dimension": 384,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "openai",
    "api_base": "http://192.168.8.4:9931/v1",
    "api_key": "local",
    "model": "local/Spark-X2.6-4B:Q8_0",
    "max_concurrent": 2
  }
}
